# Care ERP — Synology NAS Deployment via Docker Compose
# Place this file in /volume1/docker/care-erp/docker-compose.yml on your Synology NAS
# Then run: docker compose up -d

services:
  care-erp:
    build: .
    image: care-erp:latest
    container_name: care-erp
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent SQLite database — survives container updates
      - care-erp-data:/app/data
      # Persistent uploaded files (expense bills, bank statements)
      - care-erp-uploads:/app/uploads
      # Optional: mount a custom .env file for production settings
      - ./env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/care-erp.db
      # Bootstrap super-admin (only used on first run when DB is empty)
      - BOOTSTRAP_ADMIN_EMAIL=admin@yourclinic.com
      - BOOTSTRAP_ADMIN_NAME=Clinic Administrator
      - BOOTSTRAP_ADMIN_PIN=ChangeMe123!
      - CLINIC_NAME=Care Diagnostic Centre
      # Optional: USB-key gating for super-admin (leave blank to disable)
      # - SUPER_ADMIN_USB_KEY=your-secret-usb-key-content
      # - SUPER_ADMIN_USB_PIN=your-usb-pin
      # Session timeouts
      - NEXTAUTH_URL=http://your-synology-ip:3000
      - NEXTAUTH_SECRET=please-change-this-to-a-random-32-char-string
      # ============================================================
      # ICICI Orange Pay (online booking payments)
      # ⚠️ PUBLIC_BASE_URL host MUST be whitelisted in ICICI merchant dashboard
      # ============================================================
      - ICICI_MERCHANT_ID=${ICICI_MERCHANT_ID:-}
      - ICICI_AGGREGATOR_ID=${ICICI_AGGREGATOR_ID:-}
      - ICICI_SECRET_KEY=${ICICI_SECRET_KEY:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  care-erp-data:
    driver: local
  care-erp-uploads:
    driver: local
